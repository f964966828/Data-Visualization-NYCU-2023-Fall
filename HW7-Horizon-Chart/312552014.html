<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HW7 Horizon Chart</title>
        <link rel="stylesheet" href="312552014.css">
        <script src="https://d3js.org/d3.v6.js"></script>
    </head>
    <body>
        <div class="fixed-header">
            <h1> Data Visualization HW7 Horizon Chart</h1>
            <h2> 312552014 林浩君</h2>

            <div class="year-button">
                <label class="button-label">Year</label>
                <button class="toggle-button active">2017</button>
                <button class="toggle-button">2018</button>
                <button class="toggle-button">2019</button>
            </div>

            <div class="band-button">
                <label class="button-label">Bands</label>
                <button class="toggle-button">1</button>
                <button class="toggle-button active">2</button>
                <button class="toggle-button">3</button>
                <button class="toggle-button">4</button>
                <button class="toggle-button">5</button>
                <button class="toggle-button">6</button>
                <button class="toggle-button">7</button>
                <button class="toggle-button">8</button>
                <button class="toggle-button">9</button>
            </div>
        </div>

        <div id="horizon-chart", style="padding-top: 300px; padding-bottom: 300px;"></div>
        <script type="module" src="312552014.js"></script>
    </body>
</html>
