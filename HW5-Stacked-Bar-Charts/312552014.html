<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HW5 Stacked Bar Charts</title>
        <link rel="stylesheet" href="312552014.css">
        <script src="https://d3js.org/d3.v6.js"></script>
    </head>
    <body>
        <h1> Data Visualization HW5 - Stacked Bar Charts</h1>
        <h2> 312552014 林浩君</h2>

        <div class="all_buttons">
            <div class="buttons" attr="desc">
                <label>Sorting Descending</label>
                <button class="toggle-button active" attr="index">Overall</button>
                <button class="toggle-button" attr="scores_teaching">Teaching</button>
                <button class="toggle-button" attr="scores_research">Research</button>
                <button class="toggle-button" attr="scores_citations">Citation</button>
                <button class="toggle-button" attr="scores_industry_income">Industry</button>
                <button class="toggle-button" attr="scores_international_outlook">International</button>
            </div>

            <div class="buttons" attr="asc">
                <label>Sorting Ascending</label>
                <button class="toggle-button" attr="index">Overall</button>
                <button class="toggle-button" attr="scores_teaching">Teaching</button>
                <button class="toggle-button" attr="scores_research">Research</button>
                <button class="toggle-button" attr="scores_citations">Citation</button>
                <button class="toggle-button" attr="scores_industry_income">Industry</button>
                <button class="toggle-button" attr="scores_international_outlook">International</button>
            </div>
        </div>

        <div id="stacked-bar-chart"></div>
        <script src="312552014.js"></script>
    </body>
</html>
